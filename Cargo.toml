[package]
name = "whatsapp-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
qrcode = "0.14"
rmcp = { version = "3.10.0", features = ["server", "macros", "transport-io", "schemars"] }
rusqlite = { version = "0.39", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "time", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# NB: default features minus `simd` (simd needs nightly portable_simd; upstream pins nightly).
whatsapp-rust = { version = "0.7", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "ureq-client", "tokio-native", "signal"] }
